/* ----------------------------- helpers ----------------------------- */
const STORE_KEY = "diego-dashboard-v1";

function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch (e) { return {}; }
}
function useStore() {
  const [store, setStore] = useState(loadStore);
  useEffect(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {}
  }, [store]);
  return [store, setStore];
}

const STATUS_OPTIONS = [
  { key: "none", label: "Not started", color: "#9ca3af" },
  { key: "interested", label: "Interested", color: "#2563eb" },
  { key: "in_progress", label: "In progress", color: "#d97706" },
  { key: "submitted", label: "Submitted", color: "#7c3aed" },
  { key: "awarded", label: "Awarded 🎉", color: "#059669" },
  { key: "rejected", label: "Not selected", color: "#6b7280" },
];
const statusMeta = (k) => STATUS_OPTIONS.find((s) => s.key === k) || STATUS_OPTIONS[0];

function hasConcreteDate(d) { return /^\d{4}-\d{2}-\d{2}$/.test(d); }
function fmtDate(d) {
  if (!hasConcreteDate(d)) return d;
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}
function daysUntil(d) {
  if (!hasConcreteDate(d)) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const dt = new Date(d + "T00:00:00");
  return Math.round((dt - today) / 86400000);
}

/* ----------------------------- UI bits ----------------------------- */
function CategoryChip({ cat, small }) {
  const c = CATEGORIES[cat];
  if (!c) return null;
  return (
    <span className="inline-flex items-center rounded-full font-semibold text-white"
      style={{ background: c.color, fontSize: small ? 10 : 11, padding: small ? "2px 8px" : "3px 10px" }}>
      {c.label}
    </span>
  );
}

function DeadlineBadge({ deadline }) {
  const d = daysUntil(deadline);
  if (d === null) {
    return <span className="text-xs font-medium text-gray-500">{deadline}</span>;
  }
  let color = "#059669", text = `${d} days left`;
  if (d < 0) { color = "#9ca3af"; text = "Cycle passed — recurs"; }
  else if (d <= 14) { color = "#e51937"; text = `${d} days left`; }
  else if (d <= 45) { color = "#d97706"; }
  return (
    <span className="inline-flex items-center gap-1 text-xs font-bold" style={{ color }}>
      <span style={{ width: 7, height: 7, borderRadius: 99, background: color, display: "inline-block" }}></span>
      {text}
    </span>
  );
}

function StatusSelect({ value, onChange }) {
  const m = statusMeta(value);
  return (
    <select value={value} onChange={(e) => onChange(e.target.value)}
      className="rounded-lg border text-xs font-semibold px-2 py-1.5 outline-none cursor-pointer"
      style={{ borderColor: m.color, color: m.color }}>
      {STATUS_OPTIONS.map((s) => <option key={s.key} value={s.key}>{s.label}</option>)}
    </select>
  );
}

function ScholarshipsTab({ store, setStatus, setNotes }) {
  const [cat, setCat] = useState("all");
  const [eligibleOnly, setEligibleOnly] = useState(false);
  const [hideCitizenship, setHideCitizenship] = useState(false);
  const [sort, setSort] = useState("deadline");
  const [q, setQ] = useState("");

  const setStatusFn = (id, v) => setStatus(id, v);

  const filtered = useMemo(() => {
    let list = SCHOLARSHIPS.slice();
    if (cat !== "all") list = list.filter((s) => s.category === cat);
    if (eligibleOnly) list = list.filter((s) => s.eligibleNow);
    if (hideCitizenship) list = list.filter((s) => !/citizen|permanent resident|U\.S\. citizen/i.test(s.citizenshipNote || "") || /No |Not |Any|Open/i.test(s.citizenshipNote || ""));
    if (q.trim()) {
      const t = q.toLowerCase();
      list = list.filter((s) => (s.name + s.sponsor + s.description + (s.fitReasons || []).join(" ")).toLowerCase().includes(t));
    }
    list.sort((a, b) => {
      if (sort === "amount") return b.amountValue - a.amountValue;
      // deadline: concrete dates first (soonest), then rolling/varies
      const da = daysUntil(a.deadline), db = daysUntil(b.deadline);
      const va = da === null ? Infinity : (da < 0 ? da + 100000 : da);
      const vb = db === null ? Infinity : (db < 0 ? db + 100000 : db);
      return va - vb;
    });
    return list;
  }, [cat, eligibleOnly, hideCitizenship, sort, q]);

  const chipBtn = (key, label) => (
    <button onClick={() => setCat(key)}
      className="px-3 py-1.5 rounded-full text-xs font-semibold transition-colors"
      style={cat === key ? { background: "#003a63", color: "#fff" } : { background: "#fff", color: "#374151", border: "1px solid #e5e7eb" }}>
      {label}
    </button>
  );

  return (
    <div>
      <div className="flex flex-wrap items-center gap-2 mb-3">
        {chipBtn("all", "All")}
        {Object.keys(CATEGORIES).map((k) => chipBtn(k, CATEGORIES[k].label))}
      </div>
      <div className="flex flex-wrap items-center gap-3 mb-5">
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search scholarships…"
          className="flex-1 min-w-[180px] text-sm rounded-lg border border-gray-200 px-3 py-2 outline-none focus:border-howard-blue" />
        <select value={sort} onChange={(e) => setSort(e.target.value)}
          className="text-sm rounded-lg border border-gray-200 px-3 py-2 outline-none bg-white">
          <option value="deadline">Sort: Deadline (soonest)</option>
          <option value="amount">Sort: Amount (highest)</option>
        </select>
        <label className="flex items-center gap-1.5 text-xs font-medium text-gray-600 cursor-pointer">
          <input type="checkbox" checked={eligibleOnly} onChange={(e) => setEligibleOnly(e.target.checked)} /> Eligible now only
        </label>
        <label className="flex items-center gap-1.5 text-xs font-medium text-gray-600 cursor-pointer">
          <input type="checkbox" checked={hideCitizenship} onChange={(e) => setHideCitizenship(e.target.checked)} /> Hide citizenship-required
        </label>
      </div>
      <p className="text-xs text-gray-400 mb-3">{filtered.length} scholarship{filtered.length !== 1 ? "s" : ""} shown</p>
      <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-3">

  );

function EssaysTab({ store, setStore }) {
  const essays = store.essays || SEED_ESSAYS;
  const [copiedId, setCopiedId] = useState(null);

  const update = (id, field, value) => {
    setStore((prev) => {
      const list = (prev.essays || SEED_ESSAYS).map((e) => e.id === id ? { ...e, [field]: value } : e);
      return { ...prev, essays: list };
    });
  };
  const add = () => {
    setStore((prev) => {
      const list = (prev.essays || SEED_ESSAYS).slice();
      list.unshift({ id: "essay-" + Date.now(), title: "New essay", tags: "", body: "" });
      return { ...prev, essays: list };
    });
  };
  const remove = (id) => {
    if (!confirm("Delete this essay?")) return;
    setStore((prev) => ({ ...prev, essays: (prev.essays || SEED_ESSAYS).filter((e) => e.id !== id) }));
  };
  const resetSeed = () => {
    if (!confirm("Restore the original starter essays? This replaces the current list.")) return;
    setStore((prev) => ({ ...prev, essays: SEED_ESSAYS }));
  };
  const copy = (e) => {
    navigator.clipboard.writeText(e.body).then(() => {
      setCopiedId(e.id); setTimeout(() => setCopiedId(null), 1500);
    }).catch(() => {});
  };

  return (
    <div className="max-w-3xl">
      <div className="flex items-center justify-between mb-4">
        <p className="text-sm text-gray-500">Diego's reusable essay library — pre-loaded from his own essays. Copy a block, then tailor it to each prompt.</p>
      </div>
      <div className="flex gap-2 mb-5">
        <button onClick={add} className="text-xs font-bold text-white rounded-lg px-3 py-2" style={{ background: "#e51937" }}>+ New essay</button>
        <button onClick={resetSeed} className="text-xs font-semibold text-gray-600 rounded-lg px-3 py-2 border border-gray-200">Restore starters</button>
      </div>
      <div className="space-y-4">
        {essays.map((e) => (
          <details key={e.id} className="hw-card p-4" open={false}>
            <summary className="flex items-center justify-between gap-3">
              <div className="min-w-0">
                <span className="font-bold" style={{ color: "#003a63" }}>{e.title || "Untitled"}</span>
                {e.tags && <span className="ml-2 text-[11px] text-gray-400">{e.tags}</span>}
              </div>
              <span className="text-xs text-gray-400 shrink-0">{(e.body || "").split(/\s+/).filter(Boolean).length} words</span>
            </summary>
            <div className="mt-3 space-y-2">
              <input value={e.title} onChange={(ev) => update(e.id, "title", ev.target.value)}
                className="w-full text-sm font-semibold rounded-lg border border-gray-200 px-3 py-2 outline-none focus:border-howard-blue" placeholder="Essay title / prompt" />
              <input value={e.tags} onChange={(ev) => update(e.id, "tags", ev.target.value)}
                className="w-full text-xs rounded-lg border border-gray-200 px-3 py-2 outline-none focus:border-howard-blue" placeholder="Tags (e.g. leadership, financial need)" />
              <textarea value={e.body} onChange={(ev) => update(e.id, "body", ev.target.value)}
                className="w-full text-sm rounded-lg border border-gray-200 p-3 outline-none focus:border-howard-blue hw-scrollbar" rows={7} placeholder="Essay text…" />
              <div className="flex items-center gap-2">
                <button onClick={() => copy(e)} className="text-xs font-bold text-white rounded-lg px-3 py-1.5" style={{ background: "#003a63" }}>
                  {copiedId === e.id ? "Copied ✓" : "Copy text"}
                </button>
                <button onClick={() => remove(e.id)} className="text-xs font-semibold text-gray-500 rounded-lg px-3 py-1.5 border border-gray-200">Delete</button>
              </div>
            </div>
          </details>
        ))}
      </div>
    </div>
  );
}

    <button onClick={() => setTab(id)}
      className="px-4 py-2 rounded-lg text-sm font-bold transition-colors"
      style={tab === id ? { background: "#fff", color: "#003a63" } : { background: "transparent", color: "rgba(255,255,255,0.85)" }}>
      {label}
    </button>
  );

  const Stat = ({ value, label, accent }) => (
    <div className="bg-white/10 rounded-xl px-4 py-3 backdrop-blur">
      <div className="text-2xl font-extrabold" style={{ color: accent || "#fff" }}>{value}</div>
      <div className="text-[11px] uppercase tracking-wide text-white/70">{label}</div>
    </div>
  );

  return (
    <div className="min-h-screen">
      <header className="hw-banner">
        <div className="max-w-6xl mx-auto px-5 pt-7 pb-6">
          <div className="flex items-center gap-2 text-white/70 text-xs font-semibold uppercase tracking-widest mb-1">
            <span>🦬 Howard University</span><span>·</span><span>Scholarship Dashboard</span>
          </div>
          <h1 className="text-3xl md:text-4xl font-extrabold text-white">Diego's Scholarship Dashboard</h1>
          <div className="flex flex-wrap gap-2 mt-2 mb-5">
            {["Sophomore", "Computer Engineering", "Black + Hispanic/Latino", "NSBE VP", "Future PhD"].map((t) => (
              <span key={t} className="text-[11px] font-semibold text-white rounded-full px-2.5 py-1" style={{ background: "rgba(229,25,55,0.85)" }}>{t}</span>
            ))}
          </div>
          <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
            <Stat value={eligibleCount} label="Eligible now" />
            <Stat value={"$" + totalPotential.toLocaleString()} label="Potential (eligible)" accent="#ffd9a0" />
            <Stat value={dueSoon} label="Due ≤ 45 days" accent="#ffb4b4" />
            <Stat value={trackedCount} label="Tracking" />
            <Stat value={submittedCount} label="Submitted" accent="#b9f5cf" />
          </div>
          <nav className="flex gap-2 mt-6 bg-white/10 p-1 rounded-xl w-fit">
            <TabBtn id="scholarships" label="Scholarships" />
            <TabBtn id="deadlines" label="Deadlines" />
            <TabBtn id="essays" label="Essay Locker" />
          </nav>
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-5 py-7">
        {tab === "scholarships" && <ScholarshipsTab store={store} setStatus={setStatus} setNotes={setNotes} />}
        {tab === "deadlines" && <DeadlinesTab store={store} setStatus={setStatus} />}
        {tab === "essays" && <EssaysTab store={store} setStore={setStore} />}
      </main>

      <footer className="max-w-6xl mx-auto px-5 pb-10 pt-2">
        <div className="hw-card p-4 text-xs text-gray-500 leading-relaxed">
          <strong className="text-gray-700">⚠ Always verify before applying.</strong> Scholarship amounts, deadlines, and eligibility rules change every cycle. The dates here are the next realistic occurrence or a typical window — confirm everything on each scholarship's official page (the “Apply →” button). Your status, notes, and essays are saved only in <em>this</em> browser on <em>this</em> computer (localStorage); they won't sync to other devices. Built with ♥ for Diego.
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
